import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish'
}

group = findProperty('GROUP')
version = findProperty('VERSION_NAME')

android {
    namespace 'com.commit451.modalbottomsheetdialogfragment'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api('androidx.activity:activity-ktx:1.9.3')
    api('androidx.recyclerview:recyclerview:1.3.2')
    api('com.google.android.material:material:1.12.0')
}

mavenPublishing {
    configure(new AndroidSingleVariantLibrary('release', true, true))
    coordinates('com.commit451', 'modalbottomsheetdialogfragment', version.toString())
    publishToMavenCentral(SonatypeHost.S01)
    if (System.getenv('RELEASE_SIGNING_ENABLED') == 'true') {
        signAllPublications()
    }
}
